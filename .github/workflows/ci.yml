name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-debug-linux
          path: target/debug/rusty_renderer
          if-no-files-found: error
      
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-release-linux
          path: target/release/rusty_renderer
          if-no-files-found: error

  test:
    name: Test (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      
      - name: Run tests
        run: cargo test --verbose

  test-gpu:
    name: Test (GPU)
    runs-on: [self-hosted, gpu]
    needs: build
    if: false  # Disabled until we have GPU-specific tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: rusty_renderer-release-linux
          path: ./bin
      
      - name: Make binary executable
        run: chmod +x ./bin/rusty_renderer
      
      - name: Run GPU tests
        run: |
          # Future: GPU-specific integration tests will go here
          ./bin/rusty_renderer --help
          echo "GPU tests not yet implemented (placeholder for M3+)"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      
      - name: Build documentation
        run: cargo doc --no-deps --verbose
        env:
          RUSTDOCFLAGS: "-D warnings"
  
  # Windows build with DirectX 12 support
  build-windows:
    name: Build (Windows + DirectX 12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Test DirectX 12 with WARP
        run: |
          echo "Testing DirectX 12 backend with WARP software renderer"
          $env:RUSTY_RENDERER_USE_WARP = "1"
          $env:RUST_LOG = "info"
          # Run for 2 seconds to verify initialization
          cargo run --release -- --backend directx --test-duration 2
        shell: powershell
        continue-on-error: true  # Don't fail CI if DX12 isn't fully working yet
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-windows
          path: target/release/rusty_renderer.exe
