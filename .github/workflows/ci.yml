name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-debug-linux
          path: target/debug/rusty_renderer
          if-no-files-found: error
      
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-release-linux
          path: target/release/rusty_renderer
          if-no-files-found: error

  test:
    name: Test (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      
      - name: Run tests
        run: cargo test --verbose

  test-rendering-vulkan:
    name: Test Vulkan Rendering
    runs-on: [self-hosted, Linux, GPU]
    needs: build
    steps:
      - name: Add Homebrew to PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      # No need to install lavapipe - using real GPU on self-hosted runner
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gpu-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gpu-test-
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Test Vulkan headless rendering (damaged helmet)
        run: |
          mkdir -p screenshots/vulkan
          RUST_LOG=warn ./target/release/rusty_renderer \
            --scene scenes/damaged_helmet.toml \
            --backend vulkan \
            --headless \
            --max-frames 1 \
            --screenshot screenshots/vulkan/damaged_helmet.png
          
          # Verify screenshot was created
          test -f screenshots/vulkan/damaged_helmet.png
          test -s screenshots/vulkan/damaged_helmet.png
          echo "✅ Vulkan screenshot created successfully"
      
      - name: Upload Vulkan screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-vulkan
          path: screenshots/vulkan/
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      
      - name: Build documentation
        run: cargo doc --no-deps --verbose
        env:
          RUSTDOCFLAGS: "-D warnings"
  
  # Windows build with DirectX 12 support
  build-windows:
    name: Build (Windows + DirectX 12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Build examples
        run: cargo build --release --examples
      
      - name: Test DirectX 12 headless rendering
        run: |
          Write-Host "Testing DirectX 12 backend with damaged helmet scene"
          mkdir screenshots/directx -Force
          $env:RUST_LOG = "warn"
          ./target/release/rusty_renderer.exe `
            --scene scenes/damaged_helmet.toml `
            --backend directx `
            --headless `
            --max-frames 1 `
            --screenshot screenshots/directx/damaged_helmet.png
          
          # Verify screenshot was created
          if (Test-Path screenshots/directx/damaged_helmet.png) {
            $fileSize = (Get-Item screenshots/directx/damaged_helmet.png).Length
            Write-Host "DirectX screenshot size: $fileSize bytes"
            if ($fileSize -gt 0) {
              Write-Host "✅ DirectX screenshot created successfully"
            } else {
              Write-Host "❌ DirectX screenshot is empty"
              exit 1
            }
          } else {
            Write-Host "❌ DirectX screenshot not found"
            exit 1
          }
        shell: powershell
      
      - name: Upload DirectX screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-directx
          path: screenshots/directx/
          retention-days: 30
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-windows
          path: target/release/rusty_renderer.exe
  
  # Visual regression testing - compare backends and check against golden images
  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: [test-rendering-vulkan, build-windows]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install FLIP and dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install flip-evaluator numpy pillow
      
      - name: Download Vulkan screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-vulkan
          path: screenshots/vulkan/
      
      - name: Download DirectX screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-directx
          path: screenshots/directx/
        continue-on-error: true
      
      - name: List all screenshots
        run: |
          echo "📸 Available screenshots:"
          find screenshots -name "*.png" -exec ls -lh {} \;
      
      - name: Compare Vulkan vs DirectX (Backend Parity)
        id: backend_parity
        run: |
          echo "🔍 Comparing backend outputs..."
          
          # Create comparison directory
          mkdir -p comparisons/backend_parity
          
          # Compare if both screenshots exist
          if [ -f "screenshots/vulkan/damaged_helmet.png" ] && [ -f "screenshots/directx/damaged_helmet.png" ]; then
            python3 scripts/flip_compare.py \
              screenshots/vulkan/damaged_helmet.png \
              screenshots/directx/damaged_helmet.png \
              --error-map comparisons/backend_parity/vulkan_vs_directx.png || {
                echo "::warning::Backend parity test failed - outputs differ significantly"
                echo "parity_failed=true" >> $GITHUB_OUTPUT
              }
          else
            echo "⚠️  Missing screenshots - skipping backend comparison"
          fi
      
      - name: Compare against golden references
        id: golden_check
        run: |
          echo "🏆 Comparing against golden reference images..."
          
          mkdir -p comparisons/golden
          
          # Check Vulkan against golden reference
          if [ -f "references/damaged_helmet/damaged_helmet_vulkan.png" ] && [ -f "screenshots/vulkan/damaged_helmet.png" ]; then
            python3 scripts/flip_compare.py \
              references/damaged_helmet/damaged_helmet_vulkan.png \
              screenshots/vulkan/damaged_helmet.png \
              --error-map comparisons/golden/vulkan_regression.png || {
                echo "::error::Vulkan regression detected - output differs from golden reference"
                echo "vulkan_regressed=true" >> $GITHUB_OUTPUT
                exit 1
              }
          else
            echo "ℹ️  No golden reference for Vulkan - skipping"
          fi
          
          # Check DirectX against golden reference
          if [ -f "references/damaged_helmet/damaged_helmet_directx.png" ] && [ -f "screenshots/directx/damaged_helmet.png" ]; then
            python3 scripts/flip_compare.py \
              references/damaged_helmet/damaged_helmet_directx.png \
              screenshots/directx/damaged_helmet.png \
              --error-map comparisons/golden/directx_regression.png || {
                echo "::error::DirectX regression detected - output differs from golden reference"
                echo "directx_regressed=true" >> $GITHUB_OUTPUT
                exit 1
              }
          else
            echo "ℹ️  No golden reference for DirectX - skipping"
          fi
      
      - name: Generate comprehensive visual report
        run: |
          echo "📊 Generating visual regression report..."
          
          # Create organized structure for report
          mkdir -p report_data/{current,references,comparisons}
          
          # Copy current screenshots
          cp screenshots/vulkan/damaged_helmet.png report_data/current/vulkan.png 2>/dev/null || true
          cp screenshots/directx/damaged_helmet.png report_data/current/directx.png 2>/dev/null || true
          
          # Copy golden references
          cp references/damaged_helmet/damaged_helmet_vulkan.png report_data/references/vulkan.png 2>/dev/null || true
          cp references/damaged_helmet/damaged_helmet_directx.png report_data/references/directx.png 2>/dev/null || true
          
          # Copy comparison results
          cp -r comparisons/* report_data/comparisons/ 2>/dev/null || true
          
          # Generate HTML report with proper structure
          python3 scripts/generate_visual_report.py \
            report_data/ \
            visual-regression-report.html || {
              echo "⚠️  Report generation had issues but continuing..."
            }
        continue-on-error: true
      
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            comparisons/
            visual-regression-report.html
            screenshots/
          retention-days: 30
      
      - name: Check for failures and report
        if: always()
        run: |
          echo "=== Visual Regression Summary ==="
          
          if [ "${{ steps.backend_parity.outputs.parity_failed }}" == "true" ]; then
            echo "❌ Backend parity check FAILED - Vulkan and DirectX outputs differ"
          else
            echo "✅ Backend parity check PASSED"
          fi
          
          if [ "${{ steps.golden_check.outputs.vulkan_regressed }}" == "true" ]; then
            echo "⚠️  Vulkan regression detected"
          fi
          
          if [ "${{ steps.golden_check.outputs.directx_regressed }}" == "true" ]; then
            echo "⚠️  DirectX regression detected"
          fi
          
          echo ""
          echo "📊 View detailed report in the visual-regression-results artifact"
          
          # Report backend parity status (warning only - 13% diff is expected due to GLSL vs HLSL)
          if [ "${{ steps.backend_parity.outputs.parity_failed }}" == "true" ]; then
            echo "::warning::Backend parity check shows differences - this is expected (GLSL vs HLSL shaders)"
            echo "ℹ️  Backends produce ~13% RMSE difference due to different shader languages"
            echo "ℹ️  Will be resolved when we move to unified shader compilation"
          fi
