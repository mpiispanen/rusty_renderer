name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-debug-linux
          path: target/debug/rusty_renderer
          if-no-files-found: error
      
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-release-linux
          path: target/release/rusty_renderer
          if-no-files-found: error

  test:
    name: Test (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      
      - name: Run tests
        run: cargo test --verbose

  test-gpu:
    name: Test (GPU)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Vulkan software renderer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      
      - name: Install Python and FLIP
        run: |
          python3 -m pip install --upgrade pip
          pip install flip-evaluator numpy pillow
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gpu-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gpu-test-
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Test Vulkan headless rendering
        run: |
          mkdir -p screenshots
          RUST_LOG=info ./target/release/rusty_renderer \
            --backend vulkan \
            --headless \
            --screenshot screenshots/vulkan-triangle.png \
            --max-frames 1
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      
      - name: Test wgpu headless rendering
        run: |
          RUST_LOG=info ./target/release/rusty_renderer \
            --backend wgpu \
            --headless \
            --screenshot screenshots/wgpu-triangle.png \
            --max-frames 1
      
      - name: Verify screenshots were created
        run: |
          ls -lh screenshots/
          test -f screenshots/vulkan-triangle.png
          test -s screenshots/vulkan-triangle.png
          test -f screenshots/wgpu-triangle.png
          test -s screenshots/wgpu-triangle.png
          echo "✅ All screenshots created successfully"
      
      - name: Upload Linux screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/
          retention-days: 7

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      
      - name: Build documentation
        run: cargo doc --no-deps --verbose
        env:
          RUSTDOCFLAGS: "-D warnings"
  
  # Windows build with DirectX 12 support
  build-windows:
    name: Build (Windows + DirectX 12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Test DirectX 12 with WARP (headless)
        run: |
          echo "Testing DirectX 12 backend with WARP software renderer (headless)"
          mkdir screenshots
          $env:RUSTY_RENDERER_USE_WARP = "1"
          $env:RUST_LOG = "info"
          ./target/release/rusty_renderer.exe --backend direct-x --headless --screenshot screenshots/directx-triangle.png --max-frames 1
        shell: powershell
      
      - name: Verify DirectX screenshot
        run: |
          if (Test-Path screenshots/directx-triangle.png) {
            $fileSize = (Get-Item screenshots/directx-triangle.png).Length
            Write-Host "DirectX screenshot size: $fileSize bytes"
            if ($fileSize -gt 0) {
              Write-Host "✅ DirectX screenshot created successfully"
            } else {
              Write-Host "❌ DirectX screenshot is empty"
              exit 1
            }
          } else {
            Write-Host "❌ DirectX screenshot not found"
            exit 1
          }
        shell: powershell
      
      - name: Upload DirectX screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-windows
          path: target/release/rusty_renderer.exe
  
  # Generate comprehensive visual regression report with all backends
  visual-regression-report:
    name: Visual Regression Report (All Backends)
    runs-on: ubuntu-latest
    needs: [test-gpu, build-windows]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install FLIP
        run: |
          python3 -m pip install --upgrade pip
          pip install flip-evaluator numpy pillow
      
      - name: Download Linux screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/
      
      - name: Download Windows screenshots
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
      
      - name: List all screenshots
        run: |
          echo "📸 Available screenshots:"
          ls -lh screenshots/
          echo ""
          echo "Backends detected:"
          ls screenshots/ | grep -E "(vulkan|wgpu|directx)" || echo "None found"
      
      - name: Validate missing baselines (if any)
        run: |
          if [ -d references/triangle ] && [ -n "$(ls -A references/triangle/*.png 2>/dev/null || true)" ]; then
            echo "📋 Checking for missing baselines..."
            python3 scripts/validate_and_update_baselines.py \
              references/triangle/ \
              screenshots/ \
              --threshold 0.10 || {
                echo "⚠️  Some baselines missing or invalid"
                echo "   This is acceptable - baselines may not exist yet"
                exit 0
              }
          else
            echo "ℹ️  No baselines directory or baselines don't exist yet"
          fi
      
      - name: Generate comprehensive visual regression report
        run: |
          echo "📊 Generating comprehensive visual regression report..."
          echo "   Comparing all available backends..."
          
          # Generate report - will exit with code 1 if any comparison fails
          python3 scripts/generate_visual_report.py \
            screenshots/ \
            visual-regression-report.html \
            --temp-dir flip_results
          
          # Script exits with code 0 if all pass, 1 if any fail
          # CI will fail automatically if exit code is 1
      
      - name: Upload comprehensive visual regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-all-backends
          path: |
            visual-regression-report.html
            screenshots/
            flip_results/
          retention-days: 30
