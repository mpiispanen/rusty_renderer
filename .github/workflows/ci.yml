name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-debug-linux
          path: target/debug/rusty_renderer
          if-no-files-found: error
      
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-release-linux
          path: target/release/rusty_renderer
          if-no-files-found: error

  test:
    name: Test (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      
      - name: Run tests
        run: cargo test --verbose

  test-rendering-vulkan:
    name: Test Vulkan Rendering
    runs-on: [self-hosted, Linux, GPU]
    needs: build
    steps:
      - name: Add Homebrew to PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      # No need to install lavapipe - using real GPU on self-hosted runner
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gpu-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gpu-test-
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Test Vulkan headless rendering (damaged helmet)
        run: |
          mkdir -p screenshots/vulkan
          RUST_LOG=warn ./target/release/rusty_renderer \
            --scene damaged_helmet \
            --backend vulkan \
            --headless \
            --max-frames 1 \
            --screenshot screenshots/vulkan/damaged_helmet.png
          
          # Verify screenshot was created
          test -f screenshots/vulkan/damaged_helmet.png
          test -s screenshots/vulkan/damaged_helmet.png
          echo "✅ Vulkan screenshot created successfully"
      
      - name: Upload Vulkan screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-vulkan
          path: screenshots/vulkan/
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      
      - name: Build documentation
        run: cargo doc --no-deps --verbose
        env:
          RUSTDOCFLAGS: "-D warnings"
  
  # Windows build with DirectX 12 support
  build-windows:
    name: Build (Windows + DirectX 12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build (debug)
        run: cargo build --verbose
      
      - name: Build (release)
        run: cargo build --release --verbose
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Build examples
        run: cargo build --release --examples
      
      - name: Test DirectX 12 headless rendering (WARP software renderer)
        run: |
          Write-Host "Testing DirectX 12 backend with WARP software renderer"
          Write-Host "Using damaged helmet scene for validation"
          mkdir screenshots/directx -Force
          
          # Use WARP software renderer (available on all Windows runners)
          $env:RUSTY_RENDERER_USE_WARP = "1"
          $env:RUST_LOG = "warn"
          
          Write-Host "Running with WARP (software renderer)..."
          ./target/release/rusty_renderer.exe `
            --scene damaged_helmet `
            --backend directx `
            --headless `
            --max-frames 1 `
            --screenshot screenshots/directx/damaged_helmet.png
          
          # Verify screenshot was created
          if (Test-Path screenshots/directx/damaged_helmet.png) {
            $fileSize = (Get-Item screenshots/directx/damaged_helmet.png).Length
            Write-Host "DirectX screenshot size: $fileSize bytes"
            if ($fileSize -gt 0) {
              Write-Host "✅ DirectX screenshot created successfully (WARP)"
            } else {
              Write-Host "❌ DirectX screenshot is empty"
              exit 1
            }
          } else {
            Write-Host "❌ DirectX screenshot not found"
            exit 1
          }
        shell: powershell
      
      - name: Upload DirectX screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-directx
          path: screenshots/directx/
          retention-days: 30
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: rusty_renderer-windows
          path: target/release/rusty_renderer.exe
  
  # Visual regression testing - compare backends and check against golden images
  test-rendering-directx-proton:
    name: Test DirectX via Proton
    runs-on: [self-hosted, Linux, GPU]
    needs: build
    steps:
      - name: Add Homebrew to PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-proton-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-proton-test-
      
      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu --verbose
      
      - name: Check Proton availability
        id: proton_check
        run: |
          STEAM_DIR="$HOME/.local/share/Steam"
          PROTON_PATH="$STEAM_DIR/steamapps/common/Proton 9.0 (Beta)"
          
          if [ ! -d "$PROTON_PATH" ]; then
            PROTON_PATH="$STEAM_DIR/steamapps/common/Proton - Experimental"
          fi
          
          if [ -d "$PROTON_PATH" ]; then
            echo "proton_available=true" >> $GITHUB_OUTPUT
            echo "proton_path=$PROTON_PATH" >> $GITHUB_OUTPUT
            echo "✅ Proton found at: $PROTON_PATH"
          else
            echo "proton_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Proton not found, skipping DirectX/Proton tests"
            echo "Available Proton versions:"
            ls -1 "$STEAM_DIR/steamapps/common/" | grep -i proton || echo "  None"
          fi
      
      - name: Test DirectX headless rendering via Proton
        if: steps.proton_check.outputs.proton_available == 'true'
        run: |
          mkdir -p screenshots/directx-proton
          
          # Set up Proton environment
          export STEAM_COMPAT_CLIENT_INSTALL_PATH="$HOME/.local/share/Steam"
          export STEAM_COMPAT_DATA_PATH="$HOME/.proton_rusty_renderer_ci"
          
          # Create Proton prefix directory
          mkdir -p "$STEAM_COMPAT_DATA_PATH"
          
          # Run via Proton using the helper script
          chmod +x run_with_proton.sh
          export PROTON_DIR="${{ steps.proton_check.outputs.proton_path }}"
          
          echo "DISPLAY=$DISPLAY"
          
          # Use xvfb-run if available to ensure a display is present for Wine
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "Using xvfb-run"
            xvfb-run -a ./run_with_proton.sh \
              --scene scenes/damaged_helmet.toml \
              --headless \
              --max-frames 1 \
              --screenshot screenshots/directx-proton/damaged_helmet.png
          else
            echo "xvfb-run not found, running directly"
            ./run_with_proton.sh \
              --scene scenes/damaged_helmet.toml \
              --headless \
              --max-frames 1 \
              --screenshot screenshots/directx-proton/damaged_helmet.png
          fi
          
          # Verify screenshot was created
          # Note: run_with_proton.sh runs in windows_test_directx, so screenshot path is relative to that
          # But we passed a relative path "screenshots/directx-proton/..."
          # The app resolves it relative to CWD (windows_test_directx).
          # So the file should be at windows_test_directx/screenshots/directx-proton/damaged_helmet.png
          
          # Check where it actually ended up
          if [ -f "windows_test_directx/screenshots/directx-proton/damaged_helmet.png" ]; then
            echo "Found screenshot in windows_test_directx/"
            mv "windows_test_directx/screenshots/directx-proton/damaged_helmet.png" "screenshots/directx-proton/damaged_helmet.png"
          elif [ -f "screenshots/directx-proton/damaged_helmet.png" ]; then
             echo "Found screenshot in root screenshots/"
          else
             echo "❌ Screenshot not found in expected locations"
             find . -name "damaged_helmet.png"
             exit 1
          fi
          
          test -s screenshots/directx-proton/damaged_helmet.png
          echo "✅ DirectX/Proton screenshot created successfully"
      
      - name: Upload DirectX-Proton screenshots
        if: always() && steps.proton_check.outputs.proton_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-directx-proton
          path: screenshots/directx-proton/
          retention-days: 30

  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: [test-rendering-vulkan, build-windows, test-rendering-directx-proton]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install FLIP and dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install flip-evaluator numpy pillow
      
      - name: Download Vulkan screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-vulkan
          path: screenshots/vulkan/
      
      - name: Download DirectX screenshots (WARP)
        uses: actions/download-artifact@v4
        with:
          name: screenshots-directx
          path: screenshots/directx/
        continue-on-error: true
      
      - name: Download DirectX-Proton screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-directx-proton
          path: screenshots/directx-proton/
        continue-on-error: true
      
      - name: List all screenshots
        run: |
          echo "📸 Available screenshots:"
          find screenshots -name "*.png" -exec ls -lh {} \;
      
      - name: Compare Vulkan vs DirectX (Backend Parity)
        id: backend_parity
        run: |
          echo "🔍 Comparing backend outputs..."
          
          # Create comparison directory
          mkdir -p comparisons/backend_parity
          
          # Compare Vulkan vs DirectX (WARP)
          if [ -f "screenshots/vulkan/damaged_helmet.png" ] && [ -f "screenshots/directx/damaged_helmet.png" ]; then
            echo "Comparing Vulkan vs DirectX (WARP)..."
            python3 scripts/flip_compare.py \
              screenshots/vulkan/damaged_helmet.png \
              screenshots/directx/damaged_helmet.png \
              --error-map comparisons/backend_parity/vulkan_vs_directx_warp.png || {
                echo "::warning::Backend parity test failed (WARP) - outputs differ significantly"
                echo "warp_parity_failed=true" >> $GITHUB_OUTPUT
              }
          else
            echo "⚠️  Missing DirectX WARP screenshots - skipping comparison"
          fi
          
          # Compare Vulkan vs DirectX (Proton)
          if [ -f "screenshots/vulkan/damaged_helmet.png" ] && [ -f "screenshots/directx-proton/damaged_helmet.png" ]; then
            echo "Comparing Vulkan vs DirectX (Proton)..."
            python3 scripts/flip_compare.py \
              screenshots/vulkan/damaged_helmet.png \
              screenshots/directx-proton/damaged_helmet.png \
              --error-map comparisons/backend_parity/vulkan_vs_directx_proton.png || {
                echo "::warning::Backend parity test failed (Proton) - outputs differ significantly"
                echo "proton_parity_failed=true" >> $GITHUB_OUTPUT
              }
          else
            echo "⚠️  Missing DirectX Proton screenshots - skipping comparison"
          fi
          
          # Compare DirectX WARP vs Proton (should be identical)
          if [ -f "screenshots/directx/damaged_helmet.png" ] && [ -f "screenshots/directx-proton/damaged_helmet.png" ]; then
            echo "Comparing DirectX WARP vs Proton..."
            python3 scripts/flip_compare.py \
              screenshots/directx/damaged_helmet.png \
              screenshots/directx-proton/damaged_helmet.png \
              --error-map comparisons/backend_parity/directx_warp_vs_proton.png || {
                echo "::error::DirectX WARP vs Proton differ - this should not happen!"
                echo "dx_consistency_failed=true" >> $GITHUB_OUTPUT
              }
          else
            echo "⚠️  Cannot compare WARP vs Proton - missing screenshots"
          fi
      
      - name: Compare against golden references
        id: golden_check
        run: |
          echo "🏆 Comparing against golden reference images..."
          
          mkdir -p comparisons/golden
          
          # Check Vulkan against golden reference
          if [ -f "references/damaged_helmet/damaged_helmet_vulkan.png" ] && [ -f "screenshots/vulkan/damaged_helmet.png" ]; then
            python3 scripts/flip_compare.py \
              references/damaged_helmet/damaged_helmet_vulkan.png \
              screenshots/vulkan/damaged_helmet.png \
              --error-map comparisons/golden/vulkan_regression.png || {
                echo "::error::Vulkan regression detected - output differs from golden reference"
                echo "vulkan_regressed=true" >> $GITHUB_OUTPUT
                exit 1
              }
          else
            echo "ℹ️  No golden reference for Vulkan - skipping"
          fi
          
          # Check DirectX against golden reference
          if [ -f "references/damaged_helmet/damaged_helmet_directx.png" ] && [ -f "screenshots/directx/damaged_helmet.png" ]; then
            python3 scripts/flip_compare.py \
              references/damaged_helmet/damaged_helmet_directx.png \
              screenshots/directx/damaged_helmet.png \
              --error-map comparisons/golden/directx_regression.png || {
                echo "::error::DirectX regression detected - output differs from golden reference"
                echo "directx_regressed=true" >> $GITHUB_OUTPUT
                exit 1
              }
          else
            echo "ℹ️  No golden reference for DirectX - skipping"
          fi
      
      - name: Generate comprehensive visual report
        run: |
          echo "📊 Generating visual regression report..."
          
          # Create organized structure for report
          mkdir -p report_data/{current,references,comparisons}
          
          # Copy current screenshots
          cp screenshots/vulkan/damaged_helmet.png report_data/current/vulkan.png 2>/dev/null || true
          cp screenshots/directx/damaged_helmet.png report_data/current/directx.png 2>/dev/null || true
          
          # Copy golden references
          cp references/damaged_helmet/damaged_helmet_vulkan.png report_data/references/vulkan.png 2>/dev/null || true
          cp references/damaged_helmet/damaged_helmet_directx.png report_data/references/directx.png 2>/dev/null || true
          
          # Copy comparison results
          cp -r comparisons/* report_data/comparisons/ 2>/dev/null || true
          
          # Generate HTML report with proper structure
          python3 scripts/generate_visual_report.py \
            report_data/ \
            visual-regression-report.html || {
              echo "⚠️  Report generation had issues but continuing..."
            }
        continue-on-error: true
      
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            comparisons/
            visual-regression-report.html
            screenshots/
          retention-days: 30
      
      - name: Check for failures and report
        if: always()
        run: |
          echo "=== Visual Regression Summary ==="
          
          # Backend parity checks
          if [ "${{ steps.backend_parity.outputs.warp_parity_failed }}" == "true" ]; then
            echo "❌ Backend parity (Vulkan vs DirectX WARP) FAILED"
          else
            echo "✅ Backend parity (Vulkan vs DirectX WARP) PASSED"
          fi
          
          if [ "${{ steps.backend_parity.outputs.proton_parity_failed }}" == "true" ]; then
            echo "❌ Backend parity (Vulkan vs DirectX Proton) FAILED"
          else
            echo "✅ Backend parity (Vulkan vs DirectX Proton) PASSED"
          fi
          
          if [ "${{ steps.backend_parity.outputs.dx_consistency_failed }}" == "true" ]; then
            echo "❌ DirectX consistency check FAILED - WARP and Proton differ!"
            echo "::error::DirectX outputs differ between WARP and Proton - this indicates a bug"
          else
            echo "✅ DirectX consistency (WARP vs Proton) PASSED"
          fi
          
          # Golden reference checks
          if [ "${{ steps.golden_check.outputs.vulkan_regressed }}" == "true" ]; then
            echo "⚠️  Vulkan regression detected"
          fi
          
          if [ "${{ steps.golden_check.outputs.directx_regressed }}" == "true" ]; then
            echo "⚠️  DirectX regression detected"
          fi
          
          echo ""
          echo "📊 View detailed report in the visual-regression-results artifact"
          echo ""
          echo "Test configurations:"
          echo "  • Vulkan: Native Linux with real GPU"
          echo "  • DirectX (WARP): Windows runner with software renderer"
          echo "  • DirectX (Proton): Linux with real GPU via VKD3D-Proton"
          
          # Report backend parity status (warning only - some diff is expected)
          if [ "${{ steps.backend_parity.outputs.warp_parity_failed }}" == "true" ] || [ "${{ steps.backend_parity.outputs.proton_parity_failed }}" == "true" ]; then
            echo ""
            echo "::warning::Backend parity check shows differences"
            echo "ℹ️  Some differences may be expected due to shader compilation differences"
          fi
