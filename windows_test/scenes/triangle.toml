# Simple RGB Triangle Scene
# 
# This scene demonstrates the most basic scene: a single triangle with
# vertex colors (red, green, blue at each vertex).

[metadata]
name = "RGB Triangle"
description = "Simple colored triangle for testing"
author = "Rusty Renderer"

# Triangle object with inline geometry
[[objects]]
type = "mesh"
name = "triangle"

[objects.geometry]
source = "inline"
vertices = [
    { position = [0.0, -0.5, 0.0], color = [1.0, 0.0, 0.0] },  # Bottom: Red
    { position = [0.5, 0.5, 0.0], color = [0.0, 1.0, 0.0] },   # Top-right: Green
    { position = [-0.5, 0.5, 0.0], color = [0.0, 0.0, 1.0] },  # Top-left: Blue
]

# Camera looking at the triangle
[camera]
type = "perspective"
position = [0.0, 0.0, 3.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov = 45.0
near = 0.1
far = 1000.0
