[package]
name = "rusty_renderer"
version = "0.1.0"
edition = "2021"
authors = ["Matias Piispanen <matias.piispanen@gmail.com>"]
description = "A multi-backend 3D renderer supporting Vulkan, DirectX 12, and wgpu"
repository = "https://github.com/mpiispanen/rusty_renderer"
license = "MIT"
readme = "README.md"
keywords = ["graphics", "rendering", "vulkan", "directx", "wgpu"]
categories = ["graphics", "rendering"]

[dependencies]
# Window and event handling
winit = "0.30"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Vulkan bindings (M3)
vulkanalia = { version = "0.31", features = ["libloading", "window"] }

[dev-dependencies]
# Test dependencies
env_logger = "0.11"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
