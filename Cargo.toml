[package]
name = "rusty_renderer"
version = "0.1.0"
edition = "2021"
authors = ["Matias Piispanen <matias.piispanen@gmail.com>"]
description = "A multi-backend 3D renderer supporting Vulkan, DirectX 12, and wgpu"
repository = "https://github.com/mpiispanen/rusty_renderer"
license = "MIT"
readme = "README.md"
keywords = ["graphics", "rendering", "vulkan", "directx", "wgpu"]
categories = ["graphics", "rendering"]

[dependencies]
# Window and event handling
winit = "0.30"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Image handling for screenshots
image = "0.25"

# JSON parsing for FLIP Python API
serde_json = "1.0"

# Vulkan bindings (M3)
vulkanalia = { version = "0.31", features = ["libloading", "window"] }

# wgpu for cross-platform rendering (M4)
wgpu = "23.0"
pollster = "0.3"  # For blocking on async operations

# DirectX 12 bindings (M4, Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
]}

[dev-dependencies]
# Test dependencies
env_logger = "0.11"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
