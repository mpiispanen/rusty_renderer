[metadata]
name = "Simple Quad"
description = "A simple quad for testing vertex buffers"

[camera]
type = "perspective"
position = [0.0, 0.0, 20.0]
target = [0.0, 0.0, 0.0]
fov = 60.0
near = 0.1
far = 1000.0

[lighting]
ambient = [0.5, 0.5, 0.5]

[[lighting.lights]]
type = "directional"
direction = [0.0, -1.0, -1.0]
color = [1.0, 1.0, 1.0]
intensity = 1.0

[[objects]]
type = "mesh"
name = "quad"

[objects.transform]
position = [0.0, 0.0, 0.0]
rotation = [0.0, 0.0, 0.0]
scale = [1.0, 1.0, 1.0]

[objects.geometry]
source = "inline"
indices = [0, 1, 2, 0, 2, 3]

# Much bigger geometry, closer to camera
[[objects.geometry.vertices]]
position = [0.0, -2.0, 0.0]
color = [1.0, 0.0, 0.0]
normal = [0.0, 0.0, 1.0]
uv = [0.5, 1.0]

[[objects.geometry.vertices]]
position = [2.0, 2.0, 0.0]
color = [0.0, 1.0, 0.0]
normal = [0.0, 0.0, 1.0]
uv = [1.0, 0.0]

[[objects.geometry.vertices]]
position = [-2.0, 2.0, 0.0]
color = [0.0, 0.0, 1.0]
normal = [0.0, 0.0, 1.0]
uv = [0.0, 0.0]

[[objects.geometry.vertices]]
position = [2.0, -2.0, 0.0]
color = [1.0, 1.0, 0.0]
normal = [0.0, 0.0, 1.0]
uv = [1.0, 1.0]
