[metadata]
name = "Test No Shadow"
description = "Simple scene without directional light"

[[objects]]
type = "mesh"
name = "triangle"

[objects.geometry]
source = "inline"
vertices = [
    { position = [0.0, -0.5, 0.0], normal = [0.0, 0.0, 1.0], uv = [0.5, 0.0], color = [1.0, 0.0, 0.0] },
    { position = [0.5, 0.5, 0.0], normal = [0.0, 0.0, 1.0], uv = [1.0, 1.0], color = [0.0, 1.0, 0.0] },
    { position = [-0.5, 0.5, 0.0], normal = [0.0, 0.0, 1.0], uv = [0.0, 1.0], color = [0.0, 0.0, 1.0] },
]

[camera]
type = "perspective"
position = [0.0, 0.0, 3.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov = 45.0
near = 0.1
far = 100.0

[lighting]
ambient = [0.3, 0.3, 0.3]

[[lighting.lights]]
type = "point"
position = [0.0, 0.0, 2.0]
color = [1.0, 1.0, 1.0]
intensity = 1.0
